# Project config for ../../_shared/update-screenshots.sh (rocket shots "Afterglow XR").
# Device key | .monkr framing file | ASC display type. Afterglow runs in landscape: the iPhone set
# is 2868x1320, and the raw captures are stored turned a quarter so the frame can stand on its side.
CAPTURE_CMD="../Tools/capture_store_screenshots.sh"
SCREENSHOTS_DIR="screenshots"
BUNDLE_ID="com.wemiller.afterglow"
DEVICES=(
  "iphone-6.9|docs/appstore-screenshots/Afterglow-iphone.monkr|APP_IPHONE_67"
  "watch-46mm|docs/appstore-screenshots/Afterglow-watch.monkr|APP_WATCH_SERIES_10"
)
