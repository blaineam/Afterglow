# The native Afterglow app's Xcode project, generated with xcodegen (brew install xcodegen):
#   cd ios-native && xcodegen generate
# Tools/native_build_and_run.sh regenerates it when this file is newer than the project.
name: Afterglow
options:
  bundleIdPrefix: com.wemiller
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Warnings are errors here, as in the Unity app's C#.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MTL_TREAT_WARNINGS_AS_ERRORS: YES
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Afterglow:
    type: application
    platform: iOS
    sources:
      - path: Afterglow
        excludes:
          - "**/* 2.*"
      # The WebXR shim and the start page, shared with the Unity app as they are.
      - path: ../Assets/StreamingAssets/webxr/afterglow-webxr.js
        buildPhase: resources
      - path: ../Assets/StreamingAssets/webxr/index.html
        buildPhase: resources
    dependencies:
      - target: AfterglowWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wemiller.afterglow
        PRODUCT_NAME: Afterglow
        INFOPLIST_FILE: Afterglow/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Afterglow/Render/ShaderTypes.h
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  AfterglowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AfterglowTests
        excludes:
          - "**/* 2.*"
    dependencies:
      - target: Afterglow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wemiller.afterglow.tests
  AfterglowWatch:
    type: application
    platform: watchOS
    sources:
      - path: AfterglowWatch
        excludes:
          - "**/* 2.*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wemiller.afterglow.watchkitapp
        PRODUCT_NAME: AfterglowWatch
        INFOPLIST_FILE: AfterglowWatch/Info.plist
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ONLY_ACTIVE_ARCH: YES
schemes:
  Afterglow:
    build:
      targets:
        Afterglow: all
        AfterglowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AfterglowTests
