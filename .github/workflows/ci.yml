# Every push to main and every pull request.
#
# "Checks" needs nothing: it parses the scripts, lints the workflows and makes sure the Unity
# version is the same everywhere. "EditMode tests" needs a Unity licence in the repository's
# secrets (README.md, "Continuous integration"); without one it is skipped, and says so.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.0f1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Parse the scripts
        run: |
          for script in Tools/*.sh; do zsh -n "$script"; done
          python3 -m py_compile Tools/*.py

      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

      - name: One Unity version everywhere
        run: |
          project=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          echo "ProjectVersion.txt says $project"
          [ "$project" = "$UNITY_VERSION" ] || { echo "::error::The workflows say $UNITY_VERSION"; exit 1; }
          stale=$(grep -l "Hub/Editor/" README.md Tools/*.sh | xargs grep -L "Hub/Editor/$project" || true)
          [ -z "$stale" ] || { echo "::error::Another Unity version in: $stale"; exit 1; }

  license:
    name: Unity licence present?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No UNITY_LICENSE secret, so the Unity jobs are skipped. README.md, \"Continuous integration\", says how to add one."
          fi

  tests:
    name: EditMode tests
    needs: license
    if: needs.license.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-tests-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts
