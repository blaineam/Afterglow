# The native app: the project is generated from ios-native/project.yml, built for the iOS
# Simulator with warnings as errors, and its unit tests run there. No signing is needed. The
# Unity app's workflows live on in unity/ (disabled) with the rest of that project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native app (Simulator build and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios-native
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if "iPhone" in x["name"]))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild -project ios-native/Afterglow.xcodeproj -scheme Afterglow -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath Builds/ci CODE_SIGNING_ALLOWED=NO test | tail -40
      - name: Parse the scripts
        run: |
          for script in Tools/*.sh; do zsh -n "$script"; done
          python3 -m py_compile Tools/*.py
